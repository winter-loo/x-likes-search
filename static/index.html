<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Likes Vault — Instant Search & Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090a10;
      --bg-surface: #11131c;
      --bg-card: #161824;
      --bg-card-hover: #1c1f30;
      --bg-input: #1a1d2d;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --border-card: rgba(255, 255, 255, 0.06);
      --accent-primary: #6366f1;
      --accent-primary-glow: rgba(99, 102, 241, 0.25);
      --accent-cyan: #06b6d4;
      --accent-rose: #f43f5e;
      --accent-rose-glow: rgba(244, 63, 94, 0.25);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
      --shadow-hover: 0 12px 32px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(99, 102, 241, 0.25);
      --transition-fast: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-y: scroll;
      line-height: 1.5;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(6, 182, 212, 0.08), transparent);
      background-attachment: fixed;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-canvas); }
    ::-webkit-scrollbar-thumb { background: #252839; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #373b54; }

    /* Layout */
    .app-container {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px 80px 16px;
    }

    /* Top Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
      color: white;
      font-weight: 800;
      font-size: 20px;
      transition: var(--transition-fast);
    }
    .brand:hover .brand-icon {
      transform: scale(1.05) rotate(-3deg);
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .status-dot.syncing {
      background: #3b82f6;
      box-shadow: 0 0 10px #3b82f6;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      outline: none;
      transition: var(--transition-fast);
      user-select: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: white;
      box-shadow: 0 2px 10px var(--accent-primary-glow);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      box-shadow: 0 4px 16px var(--accent-primary-glow);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border-color: var(--border-subtle);
    }
    .btn-secondary:hover {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-icon {
      padding: 8px;
      border-radius: var(--radius-sm);
    }

    /* Search Box */
    .search-section {
      position: sticky;
      top: 16px;
      z-index: 50;
      margin-bottom: 24px;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(22, 24, 36, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 4px 8px 4px 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      transition: var(--transition-fast);
    }

    .search-wrapper:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 8px 32px var(--accent-primary-glow), 0 0 0 1px var(--accent-primary);
      background: rgba(26, 29, 45, 0.95);
    }

    .search-icon {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      padding: 10px 0;
    }

    .search-input::placeholder {
      color: var(--text-muted);
      font-size: 15px;
    }

    .search-kbd {
      font-family: var(--font-mono);
      font-size: 11px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 3px 6px;
      color: var(--text-muted);
      margin-right: 8px;
      pointer-events: none;
    }

    .btn-clear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      padding: 6px;
      border-radius: 50%;
      margin-right: 4px;
      transition: var(--transition-fast);
    }
    .btn-clear:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Filter & Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-fast);
      user-select: none;
    }

    .chip:hover {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .chip.active {
      background: rgba(99, 102, 241, 0.18);
      border-color: var(--accent-primary);
      color: #818cf8;
      font-weight: 600;
    }

    .stats-readout {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Feed Container */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Tweet Card */
    .tweet-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-card);
      transition: var(--transition-smooth);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
      opacity: 1;
      transform: translateY(0);
    }

    .tweet-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(99, 102, 241, 0.25);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .tweet-card.unliked {
      opacity: 0.6;
      border-left: 3px solid var(--accent-rose);
      background: rgba(244, 63, 94, 0.03);
    }

    /* Tweet Header */
    .tweet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .author-info {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .avatar-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      background: #232738;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
      position: relative;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--text-secondary);
      background: linear-gradient(135deg, #1e2235, #2d334d);
      font-size: 16px;
    }

    .author-names {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .author-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition-fast);
    }
    .author-info:hover .author-name {
      color: #818cf8;
    }

    .author-handle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .post-date {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Action Buttons in Header */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-external {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition-fast);
    }
    .btn-external:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent-primary);
      color: #a5b4fc;
      transform: translateY(-1px);
    }

    /* Tweet Content */
    .tweet-text {
      font-size: 15px;
      line-height: 1.6;
      color: #e2e8f0;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .tweet-text mark {
      background: rgba(245, 158, 11, 0.3);
      color: #fef08a;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 600;
    }

    .tweet-text a {
      color: #818cf8;
      text-decoration: none;
      transition: var(--transition-fast);
    }
    .tweet-text a:hover {
      text-decoration: underline;
      color: #a5b4fc;
    }

    /* Tweet Media */
    .media-grid {
      display: grid;
      gap: 8px;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: 4px;
    }

    .media-grid.grid-1 { grid-template-columns: 1fr; }
    .media-grid.grid-2 { grid-template-columns: 1fr 1fr; }
    .media-grid.grid-3 { grid-template-columns: 2fr 1fr; }
    .media-grid.grid-4 { grid-template-columns: 1fr 1fr; }

    .media-item {
      position: relative;
      overflow: hidden;
      background: #1e2235;
      border-radius: var(--radius-sm);
      max-height: 420px;
      cursor: zoom-in;
    }

    .media-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .media-item:hover img {
      transform: scale(1.02);
    }

    /* Tweet Footer */
    .tweet-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
      color: var(--text-muted);
    }

    .tweet-metrics {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .metric-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-unlike {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.2);
      color: #fda4af;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .btn-unlike:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--accent-rose);
      color: white;
      box-shadow: 0 0 12px var(--accent-rose-glow);
      transform: scale(1.02);
    }

    .btn-unlike.is-unliked {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-subtle);
      color: var(--text-muted);
    }
    .btn-unlike.is-unliked:hover {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #6ee7b7;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }

    .btn-read {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .btn-read:hover {
      background: rgba(99, 102, 241, 0.22);
      border-color: var(--accent-primary);
      color: white;
      box-shadow: 0 0 12px var(--accent-primary-glow);
      transform: scale(1.02);
    }
    .btn-read.is-read {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
    .btn-read.is-read:hover {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .tweet-card.is-read {
      opacity: 0.65;
    }

    /* Skeleton Loading */
    .skeleton-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .skeleton-line {
      background: linear-gradient(90deg, #1c1f30 25%, #252a42 50%, #1c1f30 75%);
      background-size: 200% 100%;
      animation: skeleton-pulse 1.5s infinite;
      border-radius: 4px;
    }

    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: #1c1f30;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-btn {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid var(--accent-primary);
      color: #a5b4fc;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox-modal.active {
      display: flex;
    }
    .lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: var(--radius-md);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      object-fit: contain;
    }
    .lightbox-close {
      position: absolute;
      top: 24px; right: 24px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <a href="/" class="brand">
        <div class="brand-icon">𝕏</div>
        <div class="brand-text">
          <h1>Likes Vault</h1>
          <p>Instant Search & Offline Archive</p>
        </div>
      </a>

      <div class="header-actions">
        <div class="status-pill" id="statusPill">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Checking...</span>
        </div>

        <button class="btn btn-primary" id="btnSync">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="syncSvg">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span id="syncBtnLabel">Sync Likes</span>
        </button>
      </div>
    </header>

    <!-- Search Box -->
    <div class="search-section">
      <div class="search-wrapper">
        <div class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <input 
          type="text" 
          class="search-input" 
          id="searchInput" 
          placeholder="Search by keywords, @author, topic, or post content..." 
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn-clear" id="btnClear" title="Clear (Esc)">✕</button>
        <span class="search-kbd">/</span>
      </div>
    </div>

    <!-- Filter & Readout -->
    <div class="controls-bar">
      <div class="filter-chips">
        <div class="chip" data-filter="unread">Unread Only 📖</div>
        <div class="chip active" data-filter="all">All Likes</div>
        <div class="chip" data-filter="media">With Media 🖼️</div>
        <div class="chip" data-filter="unliked">Cancelled / Unliked</div>
        <div class="chip" data-sort="newest">Newest First ↓</div>
        <div class="chip" data-sort="popular">Most Liked ★</div>
      </div>

      <div class="stats-readout" id="statsReadout">
        <span>Loading...</span>
      </div>
    </div>

    <!-- Feed -->
    <main class="feed-container" id="feedContainer">
      <!-- Cards rendered here via JS -->
    </main>

    <!-- Load More -->
    <div style="text-align: center; margin-top: 32px;" id="loadMoreWrap">
      <button class="btn btn-secondary" id="btnLoadMore" style="display: none;">Load More</button>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img src="" alt="Enlarged tweet media" class="lightbox-img" id="lightboxImg">
  </div>

  <script>
    // State
    const state = {
      q: '',
      onlyMedia: false,
      includeUnliked: false,
      unreadOnly: false,
      sort: 'newest',
      limit: 30,
      offset: 0,
      total: 0,
      items: [],
      isLoading: false,
      isSyncing: false
    };

    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const btnClear = document.getElementById('btnClear');
    const feedContainer = document.getElementById('feedContainer');
    const statsReadout = document.getElementById('statsReadout');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const btnSync = document.getElementById('btnSync');
    const syncBtnLabel = document.getElementById('syncBtnLabel');
    const syncSvg = document.getElementById('syncSvg');
    const btnLoadMore = document.getElementById('btnLoadMore');
    const toastContainer = document.getElementById('toastContainer');
    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    // Debounce Helper
    function debounce(fn, ms) {
      let timer;
      return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), ms);
      };
    }

    // Escape HTML
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    // Format Number (e.g. 15420 -> 15.4K)
    function formatNumber(num) {
      if (!num || num === 0) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }

    // Format Date
    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      } catch {
        return dateStr;
      }
    }

    // Highlight text
    function highlightQuery(text, query) {
      if (!query || !query.trim()) return escapeHtml(text);
      const terms = query.trim().split(/\s+/).filter(Boolean);
      if (!terms.length) return escapeHtml(text);

      let escaped = escapeHtml(text);
      // Auto-link URLs
      escaped = escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

      terms.forEach(term => {
        const regex = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        escaped = escaped.replace(regex, '<mark>$1</mark>');
      });
      return escaped;
    }

    // Toast Notification
    function showToast(msg, actionLabel = null, onAction = null) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span>${escapeHtml(msg)}</span>`;

      if (actionLabel && onAction) {
        const actionBtn = document.createElement('button');
        actionBtn.className = 'toast-btn';
        actionBtn.textContent = actionLabel;
        actionBtn.onclick = () => {
          onAction();
          toast.remove();
        };
        toast.appendChild(actionBtn);
      }

      toastContainer.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Check System Status
    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        if (data.is_syncing) {
          state.isSyncing = true;
          statusDot.className = 'status-dot syncing';
          statusText.textContent = `Syncing page ${data.current_page}...`;
          syncBtnLabel.textContent = 'Syncing...';
          btnSync.disabled = true;
        } else {
          state.isSyncing = false;
          statusDot.className = 'status-dot';
          statusText.textContent = `${data.stats.active_likes} Likes`;
          syncBtnLabel.textContent = 'Sync Likes';
          btnSync.disabled = false;
        }
      } catch (err) {
        statusDot.style.background = '#ef4444';
        statusText.textContent = 'Offline';
      }
    }

    // Fetch Search Results
    async function fetchSearch(append = false) {
      if (state.isLoading) return;
      state.isLoading = true;

      if (!append) {
        state.offset = 0;
        renderSkeletons();
      }

      const params = new URLSearchParams({
        q: state.q,
        only_media: state.onlyMedia,
        include_unliked: state.includeUnliked,
        unread_only: state.unreadOnly,
        sort: state.sort,
        limit: state.limit,
        offset: state.offset
      });

      try {
        const res = await fetch(`/api/search?${params.toString()}`);
        const data = await res.json();

        state.total = data.total;
        if (append) {
          state.items.push(...data.items);
        } else {
          state.items = data.items;
        }

        renderFeed();
        updateReadout(data.took_ms);
      } catch (err) {
        feedContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <h3>Failed to load likes</h3>
            <p style="margin-top:8px">${escapeHtml(err.message)}</p>
          </div>
        `;
      } finally {
        state.isLoading = false;
      }
    }

    function updateReadout(tookMs = 0) {
      const msText = tookMs > 0 ? ` (${tookMs}ms)` : '';
      statsReadout.innerHTML = `
        <span><strong>${state.total}</strong> likes found${msText}</span>
      `;

      if (state.items.length < state.total) {
        btnLoadMore.style.display = 'inline-flex';
      } else {
        btnLoadMore.style.display = 'none';
      }
    }

    // Render Skeletons during loading
    function renderSkeletons() {
      feedContainer.innerHTML = Array.from({ length: 4 }).map(() => `
        <div class="skeleton-card">
          <div style="display:flex; gap:12px; align-items:center;">
            <div class="skeleton-line" style="width:44px; height:44px; border-radius:50%;"></div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              <div class="skeleton-line" style="width:140px; height:14px;"></div>
              <div class="skeleton-line" style="width:90px; height:12px;"></div>
            </div>
          </div>
          <div class="skeleton-line" style="width:100%; height:16px;"></div>
          <div class="skeleton-line" style="width:85%; height:16px;"></div>
        </div>
      `).join('');
    }

    // Render Tweet Cards
    function renderFeed() {
      if (!state.items || state.items.length === 0) {
        feedContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>No liked tweets found</h3>
            <p style="margin-top:8px; font-size:14px;">Try a different keyword or click "Sync Likes" to import from X.</p>
          </div>
        `;
        return;
      }

      feedContainer.innerHTML = state.items.map(tweet => {
        const xPostUrl = `https://x.com/${escapeHtml(tweet.author_screen_name || 'i')}/status/${tweet.id}`;
        const isUnliked = tweet.is_liked === 0;
        const isRead = tweet.is_read === 1;

        // Avatar fallback
        const avatarHtml = tweet.author_avatar
          ? `<img src="${escapeHtml(tweet.author_avatar)}" class="avatar-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" loading="lazy">
             <div class="avatar-placeholder" style="display:none;">${escapeHtml((tweet.author_name || '?')[0].toUpperCase())}</div>`
          : `<div class="avatar-placeholder">${escapeHtml((tweet.author_name || '?')[0].toUpperCase())}</div>`;

        // Media Grid
        let mediaHtml = '';
        if (tweet.media_urls && tweet.media_urls.length > 0) {
          const gridClass = `grid-${Math.min(tweet.media_urls.length, 4)}`;
          const imgItems = tweet.media_urls.map(url => `
            <div class="media-item" onclick="openLightbox('${escapeHtml(url)}')">
              <img src="${escapeHtml(url)}" loading="lazy" alt="Media attachment">
            </div>
          `).join('');
          mediaHtml = `<div class="media-grid ${gridClass}">${imgItems}</div>`;
        }

        return `
          <article class="tweet-card ${isUnliked ? 'unliked' : ''} ${isRead ? 'is-read' : ''}" id="card-${tweet.id}">
            <div class="tweet-header">
              <a href="${xPostUrl}" target="_blank" rel="noopener noreferrer" class="author-info" title="Open profile / post on X">
                <div class="avatar-wrapper">
                  ${avatarHtml}
                </div>
                <div class="author-names">
                  <span class="author-name">
                    ${highlightQuery(tweet.author_name, state.q)}
                  </span>
                  <span class="author-handle">
                    @${highlightQuery(tweet.author_screen_name, state.q)}
                  </span>
                </div>
              </a>

              <div class="card-actions">
                <span class="post-date">${formatDate(tweet.created_at)}</span>
                <a href="${xPostUrl}" target="_blank" rel="noopener noreferrer" class="btn-external" title="Open original post on x.com">
                  Open on 𝕏
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="7" y1="17" x2="17" y2="7"></line>
                    <polyline points="7 7 17 7 17 17"></polyline>
                  </svg>
                </a>
              </div>
            </div>

            <div class="tweet-text">
              ${highlightQuery(tweet.text, state.q)}
            </div>

            ${mediaHtml}

            <div class="tweet-footer">
              <div class="tweet-metrics">
                <span class="metric-item" title="Replies">
                  💬 ${formatNumber(tweet.reply_count)}
                </span>
                <span class="metric-item" title="Retweets">
                  🔄 ${formatNumber(tweet.retweet_count)}
                </span>
                <span class="metric-item" title="Likes on X">
                  ❤️ ${formatNumber(tweet.favorite_count)}
                </span>
              </div>

              <div style="display:flex; align-items:center; gap:8px;">
                <button 
                  class="btn-read ${isRead ? 'is-read' : ''}" 
                  onclick="toggleRead('${tweet.id}', ${isRead})"
                  title="${isRead ? 'Mark as unread' : 'Mark as read'}"
                >
                  ${isRead ? '✓ Read' : '📖 Mark Read'}
                </button>

                <button 
                  class="btn-unlike ${isUnliked ? 'is-unliked' : ''}" 
                  onclick="toggleLike('${tweet.id}', ${isUnliked})"
                  title="${isUnliked ? 'Click to re-like on X' : 'Click to cancel like on X'}"
                >
                  ${isUnliked ? '🤍 Re-like' : '💔 Cancel Like'}
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // Toggle Read Status
    async function toggleRead(tweetId, currentlyRead) {
      const card = document.getElementById(`card-${tweetId}`);
      const btn = card?.querySelector('.btn-read');
      const newStatus = currentlyRead ? 0 : 1;

      // Optimistic UI Update
      if (newStatus === 1) {
        if (state.unreadOnly) {
          if (card) {
            card.style.transition = 'all 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.96)';
            setTimeout(() => card.remove(), 250);
          }
          showToast('Marked as read', 'Undo', () => toggleRead(tweetId, true));
        } else {
          if (card) card.classList.add('is-read');
          if (btn) {
            btn.className = 'btn-read is-read';
            btn.innerHTML = '✓ Read';
            btn.onclick = () => toggleRead(tweetId, true);
          }
          showToast('Marked as read', 'Undo', () => toggleRead(tweetId, true));
        }
      } else {
        if (card) {
          card.classList.remove('is-read');
          card.style.opacity = '1';
          card.style.transform = 'scale(1)';
        }
        if (btn) {
          btn.className = 'btn-read';
          btn.innerHTML = '📖 Mark Read';
          btn.onclick = () => toggleRead(tweetId, false);
        }
        showToast('Marked as unread');
      }

      const item = state.items.find(i => i.id === tweetId);
      if (item) item.is_read = newStatus;

      try {
        await fetch('/api/read', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tweet_id: tweetId, is_read: newStatus })
        });
        checkStatus();
      } catch (err) {
        showToast('Failed to update read status');
      }
    }

    // Toggle Like / Unlike
    async function toggleLike(tweetId, currentlyUnliked) {
      const card = document.getElementById(`card-${tweetId}`);
      const btn = card?.querySelector('.btn-unlike');
      
      const newStatus = currentlyUnliked ? 1 : 0;
      const endpoint = currentlyUnliked ? '/api/relike' : '/api/unlike';

      // Optimistic UI Update
      if (newStatus === 0) {
        if (card) card.classList.add('unliked');
        if (btn) {
          btn.className = 'btn-unlike is-unliked';
          btn.innerHTML = '🤍 Re-like';
          btn.onclick = () => toggleLike(tweetId, true);
        }
        showToast('Like cancelled on X', 'Undo', () => toggleLike(tweetId, true));
      } else {
        if (card) card.classList.remove('unliked');
        if (btn) {
          btn.className = 'btn-unlike';
          btn.innerHTML = '💔 Cancel Like';
          btn.onclick = () => toggleLike(tweetId, false);
        }
        showToast('Re-liked tweet on X');
      }

      // Update local item
      const item = state.items.find(i => i.id === tweetId);
      if (item) item.is_liked = newStatus;

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tweet_id: tweetId })
        });
        const data = await res.json();
        if (!data.success) {
          showToast('Failed to update like on X');
        }
      } catch (err) {
        showToast('Network error updating like');
      }
    }

    // Trigger Sync
    async function triggerSync() {
      if (state.isSyncing) return;
      btnSync.disabled = true;
      syncBtnLabel.textContent = 'Requesting...';

      try {
        const res = await fetch('/api/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pages: 10 })
        });
        const data = await res.json();
        showToast('Syncing likes from X in background...');
        pollSync();
      } catch (err) {
        showToast('Failed to start sync: ' + err.message);
        btnSync.disabled = false;
        syncBtnLabel.textContent = 'Sync Likes';
      }
    }

    // Poll Sync Progress
    function pollSync() {
      const interval = setInterval(async () => {
        try {
          const res = await fetch('/api/status');
          const data = await res.json();
          if (data.is_syncing) {
            statusDot.className = 'status-dot syncing';
            statusText.textContent = `Syncing page ${data.current_page}...`;
            syncBtnLabel.textContent = `Syncing (${data.total_synced_session})...`;
          } else {
            clearInterval(interval);
            checkStatus();
            fetchSearch(false);
            showToast(`Sync complete! ${data.stats.active_likes} likes in archive.`);
          }
        } catch {
          clearInterval(interval);
        }
      }, 2000);
    }

    // Lightbox
    function openLightbox(url) {
      lightboxImg.src = url;
      lightboxModal.classList.add('active');
    }
    lightboxClose.onclick = () => lightboxModal.classList.remove('active');
    lightboxModal.onclick = (e) => {
      if (e.target === lightboxModal) lightboxModal.classList.remove('active');
    };

    // Event Listeners
    const onSearchInput = debounce((e) => {
      state.q = e.target.value;
      btnClear.style.display = state.q ? 'block' : 'none';
      fetchSearch(false);
    }, 60);

    searchInput.addEventListener('input', onSearchInput);

    btnClear.onclick = () => {
      searchInput.value = '';
      state.q = '';
      btnClear.style.display = 'none';
      fetchSearch(false);
      searchInput.focus();
    };

    // Filter Chips
    document.querySelectorAll('.filter-chips .chip').forEach(chip => {
      chip.onclick = () => {
        const filter = chip.dataset.filter;
        const sort = chip.dataset.sort;

        if (filter === 'all') {
          state.onlyMedia = false;
          state.includeUnliked = false;
          state.unreadOnly = false;
          document.querySelectorAll('.filter-chips [data-filter]').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        } else if (filter === 'unread') {
          state.unreadOnly = !state.unreadOnly;
          chip.classList.toggle('active', state.unreadOnly);
          document.querySelector('.filter-chips [data-filter="all"]').classList.remove('active');
        } else if (filter === 'media') {
          state.onlyMedia = !state.onlyMedia;
          chip.classList.toggle('active', state.onlyMedia);
          document.querySelector('.filter-chips [data-filter="all"]').classList.remove('active');
        } else if (filter === 'unliked') {
          state.includeUnliked = !state.includeUnliked;
          chip.classList.toggle('active', state.includeUnliked);
          document.querySelector('.filter-chips [data-filter="all"]').classList.remove('active');
        }

        if (sort) {
          state.sort = sort;
          document.querySelectorAll('.filter-chips [data-sort]').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
        }

        fetchSearch(false);
      };
    });

    btnLoadMore.onclick = () => {
      state.offset += state.limit;
      fetchSearch(true);
    };

    btnSync.onclick = triggerSync;

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      } else if (e.key === 'Escape') {
        if (lightboxModal.classList.contains('active')) {
          lightboxModal.classList.remove('active');
        } else if (document.activeElement === searchInput) {
          searchInput.blur();
        }
      }
    });

    // Initial Load
    checkStatus();
    fetchSearch();
  </script>
</body>
</html>
